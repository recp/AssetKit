name: CMake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        config: [shared, static, cli-static]
        include:
          - config: shared
            cmake_args: -DAK_SHARED=ON -DAK_STATIC=OFF
          - config: static
            cmake_args: -DAK_SHARED=OFF -DAK_STATIC=ON
          - config: cli-static
            cmake_args: -DAK_SHARED=ON -DAK_STATIC=OFF -DAK_BUILD_CLI_STATIC=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAK_USE_TEST=ON
          -DAK_BUILD_CLI=ON
          -DAK_BUILD_DECODER_SHIMS=OFF
          -DAK_FETCH_DEPS=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: CLI smoke
        shell: bash
        run: |
          ./build/assetkit --version
          ./build/assetkit --help
